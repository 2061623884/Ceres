[project]
name = "sale-guide-backend"
version = "0.1.0"
description = "Sale-guide V1 backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
    "rapidfuzz>=3.10.0",
    # Request-level LangGraph workflow. No checkpoint saver is used: each HTTP
    # request runs one fresh graph and the business session store is the only
    # durable state.
    "langgraph~=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
